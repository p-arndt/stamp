name: Build and Publish Release
permissions:
  contents: read

# Tag pushes only. The version is decided by `stamp release` before the tag
# exists; this pipeline is a worker, not a controller.
#
# 'v*.*.*' rather than 'v*': the moving major tag the release pushes at the end
# is called 'v0', and 'v*' would match it and start a second run whose
# `stamp verify --tag v0` could only fail.
on:
  push:
    tags: ['v*.*.*']

jobs:
  # The tag has to agree with the committed version. stamp checks its own tag
  # with the code being released (not the pinned action the shared workflow
  # uses), which is also the smallest end-to-end test of `stamp verify`.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify the tag against the committed version
        run: go run . verify --tag "$GITHUB_REF_NAME"

  # Tests on all three OSes before publishing: stamp drives the git binary,
  # whose behaviour is the part most likely to differ per OS. The major tag
  # (v0) is what `uses: p-arndt/stamp@v0` resolves; it needs MAJOR_TAG_TOKEN, a
  # fine-grained token with Contents and Workflows read and write, because
  # GITHUB_TOKEN cannot move a ref that changes .github/workflows.
  release:
    needs: verify
    uses: p-arndt/.github/.github/workflows/go-release.yml@v1
    permissions:
      contents: write
    with:
      binary: stamp
      verify-tag: false
      test-os: '["windows-latest", "ubuntu-latest", "macos-latest"]'
      configure-git: true
      move-major-tag: true
    secrets:
      major-tag-token: ${{ secrets.MAJOR_TAG_TOKEN }}
