name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # vet + test + build on windows, ubuntu and macOS: stamp shells out to git,
  # and path handling, line endings and file permissions differ per OS. The
  # integration tests create commits, hence configure-git.
  ci:
    uses: p-arndt/.github/.github/workflows/go-ci.yml@v1
    with:
      race: false
      configure-git: true
